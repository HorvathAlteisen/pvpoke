# Runs the same image the dev container uses, for when you just want the site up
# without VS Code attached. The `version` key was removed: Compose v2 ignores it
# and warns about it.

services:
  web:
    container_name: pvpoke
    build:
      context: . # just this directory — keeps src/ and .git out of the build context
      dockerfile: Dockerfile
    ports:
      - "${PVPOKE_PORT:-80}:80" # Use port set in PVPOKE_PORT env variable, use port 80 as default
    # The image contains no application code; it is served entirely from here.
    volumes:
      - ../src:/var/www/html/pvpoke/src
