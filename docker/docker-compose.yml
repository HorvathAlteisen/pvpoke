# Runs the production image (docker/Dockerfile) plus a MySQL instance for the
# training-battle telemetry, for when you just want the site up without VS Code attached.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Variables come from a .env file next to this compose file or the shell environment
# (`PVPOKE_PORT`, `ORIGIN`, `PVPOKE_GA_ID`, `MYSQL_*`, …) — see ../.env.example. The
# `version` key is omitted: Compose v2 ignores it and warns about it.

services:
  web:
    container_name: pvpoke
    build:
      # The repository root, because the build needs package.json, src/ and static/.
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${PVPOKE_PORT:-80}:3000" # Use port set in PVPOKE_PORT env variable, use port 80 as default
    environment:
      ORIGIN: ${ORIGIN:-http://localhost}
      PVPOKE_GA_ID: ${PVPOKE_GA_ID:-}
      PVPOKE_GOOGLE_AD_CLIENT: ${PVPOKE_GOOGLE_AD_CLIENT:-}
      PVPOKE_DEV_TOOLS: ${PVPOKE_DEV_TOOLS:-0}
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE:-pvpoke_training}
      DB_USER: ${MYSQL_USER:-pvpoke}
      DB_PASS: ${MYSQL_PASSWORD:-pvpoke}
    depends_on:
      - db
    restart: unless-stopped

  db:
    container_name: pvpoke-db
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pvpoke_training}
      MYSQL_USER: ${MYSQL_USER:-pvpoke}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pvpoke}
    volumes:
      # Schema for training_pokemon / training_team, applied on first start only.
      - ../static/data/training/training.sql:/docker-entrypoint-initdb.d/training.sql:ro
      - pvpoke-db:/var/lib/mysql
    restart: unless-stopped

volumes:
  pvpoke-db:
