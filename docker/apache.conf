# PvPoke's entire URL routing lives in src/.htaccess. Debian's apache2 ships
# `AllowOverride None` for /var/www/, which silently ignores .htaccess — every
# pretty URL (/rankings/1500, /battle/..., /team-builder/...) 404s while the
# .php files still work, which makes the breakage easy to misdiagnose.
<Directory /var/www/html>
	Options -Indexes +FollowSymLinks
	AllowOverride All
	Require all granted
</Directory>

# The dev container bind-mounts the whole repository under the document root, so
# .git and other dotfiles would otherwise be fetchable over HTTP.
<DirectoryMatch "/\.">
	Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
	Require all denied
</FilesMatch>

# Silences the "could not reliably determine the server's fully qualified
# domain name" warning Apache logs on every start.
ServerName localhost

# Don't advertise the exact Apache/PHP versions in responses.
ServerTokens Prod
ServerSignature Off
